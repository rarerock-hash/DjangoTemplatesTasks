
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Спорт{% endblock %}</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            color: #222;
        }

        header {
            background: #173b67;
            color: white;
            padding: 25px;
            text-align: center;
        }

        nav {
            background: #102b4c;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Спортивный портал</h1>
    </header>

    <nav>
        <a href="/">Главная</a>
        <a href="/football">Футбол</a>
        <a href="/hockey">Хоккей</a>
        <a href="/basketball">Баскетбол</a>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
