
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Автомобильный портал{% endblock %}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            color: #222;
        }

        header {
            background-color: #1d3557;
            color: white;
            padding: 25px;
            text-align: center;
        }

        nav {
            background-color: #457b9d;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Автомобильный портал</h1>
    </header>

    <nav>
        <a href="/cars/">Главная</a>
        <a href="/cars/toyota">Toyota</a>
        <a href="/cars/honda">Honda</a>
        <a href="/cars/renault">Renault</a>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
