
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>День недели</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            transition: background-color 0.5s;
            background-color: {{ background_color }};
        }

        .card {
            padding: 40px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 42px;
        }

        p {
            font-size: 22px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Сегодня {{ day_name }}</h1>
        <p>Желаю тебе прекрасного дня!</p>
    </div>
</body>
</html>
